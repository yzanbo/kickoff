appId: dev.zanbo.kickoff
productName: Kickoff
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  # Agent SDK が起動する Claude Code のネイティブバイナリは asar の外に置く必要がある
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # 内蔵ターミナルの node-pty（ネイティブのモジュールと spawn-helper）
  - node_modules/node-pty/**
mac:
  target: dmg
  category: public.app-category.developer-tools
  # Apple の開発者の証明書（Developer ID）がないので、手元用の署名（ad-hoc）でアプリ全体に署名する。
  # 署名しないと、本体だけの中途半端な署名になり、開けない・同梱の実行ファイルが動かないことがある。配布するときは Developer ID と公証にする
  identity: "-"
  # ad-hoc の署名では、ライブラリの検証で読み込みを断られないよう、hardened runtime を使わない
  hardenedRuntime: false
