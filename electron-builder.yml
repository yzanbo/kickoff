appId: dev.zanbo.kickoff
productName: Kickoff
directories:
  output: dist
# Electron は npm で入れた node_modules/electron/dist（package.json の版と同じ）をそのまま使う。
# 指定しないと electron-builder がビルドのたびに GitHub から取り直し（確かめの SHASUMS も）、GitHub が 504 などを返すと入れ替えが止まる
electronDist: node_modules/electron/dist
# Electron の fuses（作った製品版の実行ファイルにだけ効き、開発版の node_modules の Electron には効かない）。
# DB のパスワードはキーチェーンの鍵（safeStorage）で暗号化しているので、AI が Bash から Kickoff 本人として
# 自分の JavaScript を動かして鍵を受け取る道をふさぐ（要件 5.12）。DB ワーカーは utilityProcess で起動するので RunAsNode は要らない
electronFuses:
  # ELECTRON_RUN_AS_NODE=1 で製品版の実行ファイルを Node として動かす
  runAsNode: false
  # --inspect などで起動して中に入る（SIGUSR1 で開く道も閉じる）
  enableNodeCliInspectArguments: false
  # NODE_OPTIONS（と NODE_EXTRA_CA_CERTS）でコードを読み込ませる
  enableNodeOptionsEnvironmentVariable: false
  # app.asar だけから読み、asar の中身が書き換えられていたら読まない
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Cookie の暗号化はオフのまま（オンにすると、DB を使わない人も入れ替えのたびにキーチェーンの許可を聞かれる）
  enableCookieEncryption: false
files:
  - out/**
  - package.json
asarUnpack:
  # Agent SDK が起動する Claude Code のネイティブバイナリは asar の外に置く必要がある
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # 内蔵ターミナルの node-pty（ネイティブのモジュールと spawn-helper）
  - node_modules/node-pty/**
  # 音声入力の「macOS の音声認識」の補助コマンド（native/kickoff-speech をビルドが作る実行ファイル）
  - out/native/**
mac:
  target: dmg
  category: public.app-category.developer-tools
  # 手元用の署名（ad-hoc）でアプリ全体に署名する。配り方は「使う人が clone して npm run install-app で自分の Mac に作って入れる」なので、
  # Apple の証明書（Developer ID）と公証は要らない。署名しないと、本体だけの中途半端な署名になり、開けない・同梱の実行ファイルが動かないことがある。
  # 自分用の証明書は作らない（codesign が黙って使える鍵を置くと、AI が自作のプログラムに Kickoff の署名を付けてキーチェーンの鍵を取り出せるため。
  # 仮の署名はキーチェーンの許可を中身に結びつけるので、入れ替えたあと最初に DB のパスワードを読むときに 1 回だけ許可を聞かれる。要件 5.12）
  identity: "-"
  # ad-hoc の署名では、ライブラリの検証で読み込みを断られないよう、hardened runtime を使わない
  hardenedRuntime: false
  # チャット欄の音声入力で、macOS がマイクの許可を聞けるようにする（説明がないと、マイクを使おうとした時点で断られる）。
  # hardened runtime を使わないので、マイクの entitlement（com.apple.security.device.audio-input）は要らない
  extendInfo:
    NSMicrophoneUsageDescription: チャット欄の音声入力で、話した内容を文字にするためにマイクを使います。
