# アプリ ID（scripts/mac-privacy.mjs の PRODUCTION_BUNDLE_ID・notifications の KICKOFF_BUNDLE_ID と同じ）。保存先はアプリの名前で決まるので、替えてもデータは引き継がれる。
# 配ったあとは変えない（別のアプリ扱いになり、許可を取り直し、更新も入らなくなる）
appId: app.nexy.Kickoff
productName: Kickoff
directories:
  output: dist
# Electron は npm で入れた node_modules/electron/dist（package.json の版と同じ）をそのまま使う。
# 指定しないと electron-builder がビルドのたびに GitHub から取り直し（確かめの SHASUMS も）、GitHub が 504 などを返すと入れ替えが止まる
electronDist: node_modules/electron/dist
# Electron の fuses（作った製品版の実行ファイルにだけ効き、開発版の node_modules の Electron には効かない。確かめは node node_modules/@electron/fuses/dist/bin.js read --app <作った .app>）。
# DB のパスワードはキーチェーンの鍵（safeStorage）で暗号化しているので、AI が Bash から Kickoff 本人として
# 自分の JavaScript を動かして鍵を受け取る道をふさぐ。DB ワーカーは utilityProcess で起動するので RunAsNode は要らない
electronFuses:
  # ELECTRON_RUN_AS_NODE=1 で製品版の実行ファイルを Node として動かす
  runAsNode: false
  # --inspect などで起動して中に入る（SIGUSR1 で開く道も閉じる）
  enableNodeCliInspectArguments: false
  # NODE_OPTIONS（と NODE_EXTRA_CA_CERTS）でコードを読み込ませる
  enableNodeOptionsEnvironmentVariable: false
  # app.asar だけから読み、asar の中身が書き換えられていたら読まない
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Cookie の暗号化はオフのまま（オンにすると、DB を使わない人も入れ替えのたびにキーチェーンの許可を聞かれる）
  enableCookieEncryption: false
files:
  - out/**
  - package.json
asarUnpack:
  # Agent SDK が起動する Claude Code のネイティブバイナリは asar の外に置く必要がある
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # Copilot SDK に同梱の Copilot のランタイム（起動する実行ファイルと runtime.node）と、SDK が読む FFI の koffi も asar の外に置く
  # （製品版で動くかは、Copilot を使い始める前に確かめる）
  - node_modules/@github/copilot-sdk-*/**
  - node_modules/koffi/**
  # 内蔵ターミナルの node-pty（ネイティブのモジュールと spawn-helper）
  - node_modules/node-pty/**
  # 音声入力の「macOS の音声認識」の補助コマンド（native/kickoff-speech をビルドが作る実行ファイル）
  - out/native/**
mac:
  # 配る形は dmg（初めて入れるとき）と zip（更新。electron-updater が読む）。Apple Silicon だけ
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # 署名は electron-builder にさせない（信頼の設定のない自前の印鑑を選べず、黙って仮の署名で成功してしまうため）。
  # afterPack（scripts/after-pack.mjs）が、金庫の印鑑（KICKOFF_SIGN=release）か仮の署名で、Hardened Runtime と build/entitlements.mac.plist の権限を付けて押す
  identity: null
  extendInfo:
    # チャット欄の音声入力で、macOS がマイクの許可を聞けるようにする（説明がないと、マイクを使おうとした時点で断られる）
    NSMicrophoneUsageDescription: チャット欄の音声入力で、話した内容を文字にするためにマイクを使います。
    # ターミナルや AI のコマンドからほかのアプリを操作するとき、macOS が許可を聞けるようにする（Hardened Runtime では権限と説明の両方が要る）
    NSAppleEventsUsageDescription: ターミナルや AI のコマンドから、ほかのアプリを操作するときに使います。
afterPack: scripts/after-pack.mjs
# 版の一覧（latest-mac.yml）の置き場所。配ったあとは変えない（配った版は古い場所を見続け、新しい版に気づかなくなる）
publish:
  provider: generic
  url: https://nexy-apps.github.io/kickoff/
# β 版（0.1.0-beta.1 など）でも、版の一覧を beta-mac.yml に分けず latest-mac.yml の 1 つにする（分け方は 1.0 を出すときに決める）
detectUpdateChannel: false
