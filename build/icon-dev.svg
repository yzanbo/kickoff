<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kickoff の開発版（npm run dev）のアイコン。本番（icon.svg）と同じ絵の下に、黄色の帯で DEV と入れて見分ける。元の説明: K の上の腕が右上への矢印になり、「始める・打ち上げる」を表す。macOS のアイコンの枠（824 の角丸の四角）に合わせる -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22302a"/>
      <stop offset="1" stop-color="#101614"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="720" y1="260" x2="300" y2="760">
      <stop offset="0" stop-color="#a6e6c1"/>
      <stop offset="1" stop-color="#3f9f6c"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- 縦の線・上の腕（右上への矢印）・下の脚を 1 本の形で描く（重なりに境目が出ないように） -->
  <path d="M340 300 V724 M340 640 L680 300 M540 300 H680 V440 M500 480 L690 724" fill="none" stroke="url(#mark)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 開発版の印（下の帯） -->
  <g clip-path="url(#body)">
    <rect x="100" y="800" width="824" height="124" fill="#f0b43c"/>
    <text x="512" y="896" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="12" fill="#2a1d00">DEV</text>
  </g>
</svg>
