<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://github.com https://*.githubusercontent.com; connect-src 'self'" />
    <!-- 起動直後の地の色と骨組み（保存したテーマ・サイドバーの開閉と幅を <html> に出す） -->
    <script src="/boot.js"></script>
    <style>
      /*
       * 起動直後の地の色と骨組み: 地の色に、サイドバーの欄（保存した幅・閉じていれば出さない）と下の帯だけを描く（文字・行の形・動く光は描かない。幅 720px 以下は下の @media）。
       * 上の帯（信号機ボタンの行の 44px）は、本物の画面ではどの画面でも地と同じ色で、区切りの線もないので描かない（地と少し違う色の面にすると、
       * React が描いた瞬間に帯の色だけが消えてちらつく）。React が描いたら #root の中身ごと置き換わる。色は styles/base/tokens.css の
       * --bg・--bg-sidebar・--border と同じ値、幅の境目は styles/base/mobile.css と同じ 720px（src/app/renderer/bootScript.test.ts で確かめる）
       */
      :root { --boot-bg: #141818; --boot-sidebar: #0f1313; --boot-line: #1e2626; }
      :root[data-theme="light"] { --boot-bg: #ffffff; --boot-sidebar: #f2f4f6; --boot-line: #e0e3e6; }
      html, body { margin: 0; background: var(--boot-bg); }
      .boot-shell { position: fixed; inset: 0; display: flex; align-items: flex-start; pointer-events: none; }
      .boot-sidebar { flex: none; box-sizing: border-box; width: var(--boot-sidebar-w, 294px); height: 100%; border-right: 1px solid var(--boot-line); background: var(--boot-sidebar); }
      /*
       * 下の帯（styles/footer/footer.css の .app-footer。格子の列いっぱい = サイドバーの下も通る）: 出す設定（kickoff:footer-mode が show）なら、
       * いちばん下に横幅いっぱい・24px・上に区切りの線で描き、サイドバーはその上で終わる。サイドバーを閉じていても同じ。
       * 下端に寄せたときだけ出す hover は本物でも透明で格子の行を取らず、非表示 hide は出さないので、描かずにサイドバーを下まで
       */
      .boot-footer { position: absolute; right: 0; bottom: 0; left: 0; box-sizing: border-box; height: 24px; border-top: 1px solid var(--boot-line); background: var(--boot-sidebar); }
      :root:not([data-boot-footer="hover"], [data-boot-footer="hide"]) .boot-sidebar { height: calc(100% - 24px); }
      :root[data-boot-footer="hover"] .boot-footer,
      :root[data-boot-footer="hide"] .boot-footer { display: none; }
      :root[data-boot-shell="main"] .boot-sidebar { display: none; }
      :root[data-boot-shell="plain"] .boot-shell { display: none; }
      /*
       * 幅 720px 以下は画面と同じく縦 1 列（styles/base/mobile.css）: サイドバーは上に横幅いっぱい・高さ 40dvh で、下に区切りの線
       * （下の帯があってもなくても同じ。中身が少なくて本物が 40dvh より低いときだけずれる）。サイドバーを閉じているときは、
       * 本物では下の帯が画面の外に出る（サイドバーの行が抜けて格子の行がずれる）ので、地の色だけ
       */
      @media (max-width: 720px) {
        .boot-shell { flex-direction: column; align-items: stretch; }
        .boot-sidebar,
        :root:not([data-boot-footer="hover"], [data-boot-footer="hide"]) .boot-sidebar { width: auto; height: 40dvh; border-right: none; border-bottom: 1px solid var(--boot-line); }
        :root[data-boot-shell="main"] .boot-footer { display: none; }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kickoff</title>
  </head>
  <body>
    <div id="root"><div class="boot-shell" aria-hidden="true"><div class="boot-sidebar"></div><div class="boot-footer"></div></div></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
